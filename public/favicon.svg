<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="favBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a352d"/>
      <stop offset="50%" stop-color="#24211d"/>
      <stop offset="100%" stop-color="#141311"/>
    </linearGradient>
    <linearGradient id="favInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a09"/>
      <stop offset="100%" stop-color="#181715"/>
    </linearGradient>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe8a8"/>
      <stop offset="40%" stop-color="#ffbd63"/>
      <stop offset="100%" stop-color="#e68825"/>
    </linearGradient>
  </defs>

  <!-- Metronome Outer Body -->
  <path d="M 20 4
           L 28 4
           A 3 3 0 0 1 31 6.5
           L 41 38
           A 3 3 0 0 1 38 42
           L 10 42
           A 3 3 0 0 1 7 38
           L 17 6.5
           A 3 3 0 0 1 20 4 Z"
        fill="url(#favBody)"
        stroke="#5a5042"
        stroke-width="1.2"/>

  <!-- Inner Cavity -->
  <path d="M 21 8
           L 27 8
           A 2 2 0 0 1 29 9.8
           L 36 36
           A 2 2 0 0 1 34 38
           L 14 38
           A 2 2 0 0 1 12 36
           L 19 9.8
           A 2 2 0 0 1 21 8 Z"
        fill="url(#favInner)"
        stroke="#1c1a17"
        stroke-width="1"/>

  <!-- Subtle Scale Notches -->
  <line x1="18" y1="16" x2="21" y2="16" stroke="#ffbd63" stroke-opacity="0.6" stroke-width="1" stroke-linecap="round"/>
  <line x1="27" y1="16" x2="30" y2="16" stroke="#ffbd63" stroke-opacity="0.6" stroke-width="1" stroke-linecap="round"/>

  <line x1="17" y1="22" x2="21" y2="22" stroke="#ffbd63" stroke-opacity="0.75" stroke-width="1" stroke-linecap="round"/>
  <line x1="27" y1="22" x2="31" y2="22" stroke="#ffbd63" stroke-opacity="0.75" stroke-width="1" stroke-linecap="round"/>

  <line x1="16" y1="28" x2="21" y2="28" stroke="#ffbd63" stroke-opacity="0.6" stroke-width="1" stroke-linecap="round"/>
  <line x1="27" y1="28" x2="32" y2="28" stroke="#ffbd63" stroke-opacity="0.6" stroke-width="1" stroke-linecap="round"/>

  <!-- Swing Motion Arc -->
  <path d="M 18 5 Q 24 2.5 30 5" fill="none" stroke="#ffbd63" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="1.5 2" stroke-linecap="round"/>

  <!-- Swinging Pendulum Needle (18 deg) -->
  <g transform="rotate(18, 24, 36)">
    <!-- Needle Rod -->
    <line x1="24" y1="36" x2="24" y2="3" stroke="#f4efe6" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Sliding Weight (Bob) -->
    <rect x="20.5" y="14" width="7" height="6" rx="1" fill="url(#favGold)" stroke="#fff0c4" stroke-width="0.6"/>
    <line x1="21.5" y1="17" x2="26.5" y2="17" stroke="#4a2200" stroke-width="0.8"/>
    <circle cx="24" cy="17" r="1" fill="#241201"/>

    <!-- Glowing Tip Beat Indicator -->
    <circle cx="24" cy="3" r="2.2" fill="#ffbd63" stroke="#ffffff" stroke-width="0.8"/>
  </g>

  <!-- Bottom Pivot -->
  <circle cx="24" cy="36" r="3" fill="#141311" stroke="#423b30" stroke-width="1"/>
  <circle cx="24" cy="36" r="1.5" fill="url(#favGold)"/>

  <!-- Base Plate & Feet -->
  <rect x="11" y="40" width="26" height="2" rx="0.8" fill="url(#favBody)" stroke="#423b30" stroke-width="0.6"/>
  <rect x="21" y="40.5" width="6" height="1" rx="0.5" fill="url(#favGold)"/>
</svg>